{% extends "base.html" %}
{% block tabs %}
  {{ super() }}
  <section class="hero" aria-label="Sunny beach" data-beach-hero>
    <div class="hero__fallback" aria-hidden="true"></div>
    <canvas class="hero__canvas" role="img" aria-label="Procedural sunlit ocean: waves roll over a sandy shoreline"></canvas>
    <div class="hero__content">
      <h1>Xiao Fan</h1>
      <p>Exploring AI generalization</p>
    </div>
    <div class="hero__toolbar" hidden>
      <div class="hero__controls" role="group" aria-label="Beach ambience">
        <button type="button" class="hero__motion" aria-pressed="false">Play waves</button>
        <button type="button" class="hero__sound" aria-pressed="false">Sound off</button>
      </div>
      <span class="hero__status" role="status"></span>
    </div>
    <a class="hero__scroll" href="#homepage-profile" aria-label="Explore my profile">Explore <span aria-hidden="true">↓</span></a>
  </section>
{% endblock %}
{% block scripts %}
  {{ super() }}
  <script src="{{ 'javascripts/beach.js' | url }}" defer></script>
{% endblock %}
