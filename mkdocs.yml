site_name: AnikiFan's Personal Website
site_url: https://xiaofan.ac.cn/
site_author: AnikiFan
site_description: >-
  Xiao Fan (范潇) — D.Eng. student at Tsinghua University.
  Research interests: test-time adaptation and self-evolving embodied agents.
repo_name: AnikiFan/AnikiFan.github.io
repo_url: https://github.com/AnikiFan/AnikiFan.github.io
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025–2026 Xiao Fan

theme:
  name: material
  custom_dir: overrides
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/favicon.png
  icon:
    logo: material/account-circle

plugins:
  - blog
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - macros
  - glightbox

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: AnikiFan
      repo: AnikiFan.github.io
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Blog:
    - blog/index.md
  - Papers:
    - papers/index.md
    - My First Paper: papers/test.md
  - Projects:
    - projects/index.md
    - My First Project: projects/test.md
  - Notes:
    - notes/index.md
  - Gallery:
    - gallery/index.md
    - Tongji Picture: gallery/tongji.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AnikiFan
      name: GitHub
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.com/citations?user=XeFBXxYAAAAJ&hl=en
      name: Google Scholar
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/xiao-fan-42064336b
      name: LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/oaa9449qUd29951
      name: X

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js

validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: warn
